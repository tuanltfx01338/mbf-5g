<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bản đồ vị trí phát sóng 5G</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  :root{
    --bg:#0b1020; --panel:#12182b; --panel2:#0e1426; --border:#22304d;
    --text:#e8edf9; --muted:#8ea0c4; --accent:#3b82f6; --accent2:#22d3ee;
    --on:#22c55e; --on1:#f59e0b; --danger:#ef4444;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);}
  #app{display:flex;height:100vh;width:100%;}
  #map{flex:1;height:100%;background:#0b1020;}
  #sidebar{
    width:320px;min-width:320px;height:100%;background:var(--panel);
    border-right:1px solid var(--border);display:flex;flex-direction:column;
    overflow:hidden;z-index:1000;
  }
  #sidebar.collapsed{width:0;min-width:0;}
  .sb-inner{padding:16px;overflow-y:auto;height:100%;}
  h1{font-size:16px;margin:0 0 2px;font-weight:700;letter-spacing:.2px;}
  .sub{font-size:12px;color:var(--muted);margin:0 0 16px;}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px;}
  .card h2{font-size:12px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);margin:0 0 10px;font-weight:600;}
  .radius-row{display:flex;gap:6px;}
  .radius-btn{
    flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--border);
    background:#0d1428;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
    transition:all .15s;
  }
  .radius-btn:hover{border-color:var(--accent);}
  .radius-btn.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .stat{background:#0d1428;border:1px solid var(--border);border-radius:8px;padding:8px 10px;}
  .stat .num{font-size:18px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:2px;}
  .stat.on .num{color:var(--on);}
  .stat.on1 .num{color:var(--on1);}
  .toggle-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;font-size:13px;}
  .toggle-row input{accent-color:var(--accent);width:16px;height:16px;cursor:pointer;}
  input[type="text"]{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
    background:#0d1428;color:var(--text);font-size:13px;outline:none;
  }
  input[type="text"]:focus{border-color:var(--accent);}
  select{
    width:100%;padding:9px 10px;border-radius:8px;border:1px solid var(--border);
    background:#0d1428;color:var(--text);font-size:13px;outline:none;cursor:pointer;
    appearance:none;-webkit-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0l5 6 5-6z' fill='%238ea0c4'/></svg>");
    background-repeat:no-repeat;background-position:right 12px center;
  }
  select:focus{border-color:var(--accent);}
  .btn{
    width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);
    background:#0d1428;color:var(--text);font-size:13px;font-weight:600;cursor:pointer;
    margin-top:6px;text-align:center;
  }
  .btn:hover{border-color:var(--accent2);color:var(--accent2);}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .btn.primary:hover{filter:brightness(1.1);color:#fff;}
  #geoSearchResults{max-height:200px;overflow-y:auto;margin-top:6px;}
  .search-item{padding:8px 8px;font-size:12px;border-radius:6px;cursor:pointer;color:var(--muted);border-bottom:1px solid var(--border);}
  .search-item:last-child{border-bottom:none;}
  .search-item:hover{background:#182142;color:var(--text);}
  .search-item .si-title{color:var(--text);font-weight:600;margin-bottom:2px;}
  .search-loading{font-size:12px;color:var(--muted);padding:6px 2px;}
  #toggleSidebar{
    position:absolute;top:12px;left:12px;z-index:1001;background:var(--panel);
    border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:8px;
    cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center;
  }
  .leaflet-popup-content-wrapper{background:var(--panel2);color:var(--text);border-radius:10px;border:1px solid var(--border);}
  .leaflet-popup-tip{background:var(--panel2);}
  .popup-title{font-weight:700;font-size:13px;margin-bottom:4px;}
  .popup-row{font-size:12px;color:var(--muted);margin:2px 0;}
  .popup-row b{color:var(--text);font-weight:500;}
  .badge{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11px;font-weight:700;}
  .badge.on{background:rgba(34,197,94,.18);color:var(--on);}
  .badge.on1{background:rgba(245,158,11,.18);color:var(--on1);}
  .legend-item{display:flex;align-items:center;gap:8px;font-size:12px;margin:4px 0;color:var(--muted);}
  .dot{width:10px;height:10px;border-radius:50%;flex:none;}
  #loadTag{position:absolute;bottom:10px;left:10px;z-index:1000;background:rgba(18,24,43,.85);color:var(--muted);font-size:11px;padding:5px 10px;border-radius:6px;border:1px solid var(--border);}
  @media (max-width:640px){
    #sidebar{position:absolute;left:0;top:0;height:100%;box-shadow:0 0 30px rgba(0,0,0,.5);}
  }
</style>
</head>
<body>
<div id="app">
  <div id="sidebar">
    <div class="sb-inner">
      <h1>📡 Bản đồ vị trí phát sóng 5G</h1>
      <p class="sub" id="siteCountSub">Đang tải dữ liệu…</p>

      <div class="card">
        <h2>Lọc theo Phường/Xã</h2>
        <select id="wardFilter">
          <option value="__all__">Tất cả</option>
        </select>
      </div>

      <div class="card">
        <h2>Bán kính vùng phủ</h2>
        <div class="radius-row">
          <button class="radius-btn" data-r="150">150 m</button>
          <button class="radius-btn active" data-r="200">200 m</button>
          <button class="radius-btn" data-r="300">300 m</button>
        </div>
        <div class="legend-item" style="margin-top:10px;"><span class="dot" style="background:#22c55e"></span> 150m (trong cùng)</div>
        <div class="legend-item"><span class="dot" style="background:#eab308"></span> 200m (vòng giữa)</div>
        <div class="legend-item"><span class="dot" style="background:#ef4444"></span> 300m (vòng ngoài)</div>
      </div>

      <div class="card">
        <h2>Tìm địa chỉ / toạ độ</h2>
        <input type="text" id="geoSearchBox" placeholder="Nhập địa chỉ hoặc lat,long (VD: 10.85,106.65)…">
        <div class="btn primary" id="geoSearchBtn" style="margin-top:8px;">🔍 Tìm</div>
        <div id="geoSearchResults"></div>
      </div>

      <div class="card">
        <h2>Xuất dữ liệu</h2>
        <div class="btn primary" id="btnExportKml">⬇ Xuất KML cho Google Earth</div>
      </div>
    </div>
  </div>
  <button id="toggleSidebar">☰</button>
  <div id="map"></div>
  <div id="loadTag"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.js"></script>

const COLOR_ON = '#22c55e';
const COLOR_ON1 = '#f59e0b';

// Nested radius rings: innermost = green, middle band = yellow, outer band = red
const RADIUS_LEVELS = [
  { r: 150, color: '#22c55e' }, // xanh lá
  { r: 200, color: '#eab308' }, // vàng
  { r: 300, color: '#ef4444' }  // đỏ
];

let currentRadius = 200;
let currentWard = '__all__';
let showCircles = true, useCluster = true;

const map = L.map('map', { zoomControl: true, preferCanvas: true }).setView([10.85, 106.65], 11);

const osmLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ'
});
const osmLayerFallback = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19, attribution: '&copy; OpenStreetMap'
});
const satLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
  maxZoom: 19, attribution: 'Tiles &copy; Esri'
});
osmLayer.addTo(map);

// If the primary tile provider fails to load any tiles, fall back to OSM directly.
let tileLoadedOk = false;
let tileErrorCount = 0;
osmLayer.on('tileload', () => { tileLoadedOk = true; });
osmLayer.on('tileerror', () => {
  tileErrorCount++;
  if (!tileLoadedOk && tileErrorCount > 4) {
    map.removeLayer(osmLayer);
    osmLayerFallback.addTo(map);
  }
});

const clusterGroup = L.markerClusterGroup({ maxClusterRadius: 45, spiderfyOnMaxZoom: true, disableClusteringAtZoom: 17 });
const plainMarkerLayer = L.layerGroup();
const circleLayer = L.layerGroup();
const markerRefs = [];

function colorFor(s){ return s === 'ON1' ? COLOR_ON1 : COLOR_ON; }

function popupHtml(site){
  const badgeClass = site.s === 'ON1' ? 'on1' : 'on';
  return `
    <div class="popup-title">${site.n || site.o}</div>
    <div class="popup-row"><b>STT:</b> ${site.id}</div>
    <div class="popup-row"><b>Site cũ:</b> ${site.o}</div>
    <div class="popup-row"><b>Phường/Xã:</b> ${site.w || 'Chưa xác định'}</div>
    <div class="popup-row"><b>Toạ độ:</b> ${site.lat}, ${site.lon}</div>
    <div class="popup-row"><b>Trạng thái:</b> <span class="badge ${badgeClass}">${site.s}</span></div>
  `;
}

function buildMarkers(){
  SITES.forEach(site => {
    const color = colorFor(site.s);
    const marker = L.circleMarker([site.lat, site.lon], {
      radius: 5, color: color, weight: 1.5, fillColor: color, fillOpacity: 0.9
    }).bindPopup(popupHtml(site));
    // One circle per radius level (150/200/300), drawn largest-to-smallest so
    // the bands show through: green core, yellow ring, red ring.
    const circles = RADIUS_LEVELS.map(level => L.circle([site.lat, site.lon], {
      radius: level.r, color: level.color, weight: 1, fillColor: level.color, fillOpacity: 0.18
    }).bindPopup(popupHtml(site)));
    markerRefs.push({ site, marker, circles });
  });
}
buildMarkers();

function passesFilter(site){
  if (currentWard !== '__all__' && site.w !== currentWard) return false;
  return true;
}

function levelIndexForRadius(r){
  const idx = RADIUS_LEVELS.findIndex(l => l.r === r);
  return idx === -1 ? RADIUS_LEVELS.length - 1 : idx;
}

function rebuildLayers(){
  clusterGroup.clearLayers();
  plainMarkerLayer.clearLayers();
  circleLayer.clearLayers();
  const maxIdx = levelIndexForRadius(currentRadius);
  markerRefs.forEach(({site, marker, circles}) => {
    if (!passesFilter(site)) return;
    if (useCluster) clusterGroup.addLayer(marker);
    else plainMarkerLayer.addLayer(marker);
    if (showCircles){
      // Add from the largest visible level down to the smallest, so smaller
      // (inner) circles render on top of larger (outer) ones.
      for (let i = maxIdx; i >= 0; i--){
        circleLayer.addLayer(circles[i]);
      }
    }
  });
  document.getElementById('siteCountSub').textContent =
    currentWard === '__all__'
      ? `${SITES.length.toLocaleString('vi-VN')} vị trí phát sóng 5G tại TP.HCM & lân cận`
      : `${SITES.filter(passesFilter).length.toLocaleString('vi-VN')} vị trí phát sóng 5G tại ${currentWard}`;
}

function refreshMapLayers(){
  map.removeLayer(clusterGroup); map.removeLayer(plainMarkerLayer); map.removeLayer(circleLayer);
  if (showCircles) circleLayer.addTo(map);
  if (useCluster) clusterGroup.addTo(map); else plainMarkerLayer.addTo(map);
}

let searchMarker = null;

function flyToResult(lat, lon, label){
  if (searchMarker) map.removeLayer(searchMarker);
  const icon = L.divIcon({
    className: '',
    html: '<div style="width:16px;height:16px;border-radius:50% 50% 50% 0;background:#3b82f6;border:2px solid #fff;transform:rotate(-45deg);box-shadow:0 2px 6px rgba(0,0,0,.5);"></div>',
    iconSize: [16,16], iconAnchor: [8,16]
  });
  searchMarker = L.marker([lat, lon], { icon }).addTo(map);
  if (label) searchMarker.bindPopup(`<div class="popup-title">📍 ${label}</div><div class="popup-row">${lat.toFixed(6)}, ${lon.toFixed(6)}</div>`).openPopup();
  map.setView([lat, lon], 17);
}

function parseCoordInput(q){
  const m = q.trim().match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)$/);
  if (!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  if (isNaN(lat) || isNaN(lon)) return null;
  if (Math.abs(lat) > 90 || Math.abs(lon) > 180) return null;
  return { lat, lon };
}

async function runGeoSearch(){
  const box = document.getElementById('geoSearchBox');
  const resultsEl = document.getElementById('geoSearchResults');
  const q = box.value.trim();
  if (!q) return;

  const coord = parseCoordInput(q);
  if (coord){
    resultsEl.innerHTML = '';
    flyToResult(coord.lat, coord.lon, 'Toạ độ nhập');
    return;
  }

  resultsEl.innerHTML = '<div class="search-loading">Đang tìm…</div>';

  // Provider 1: Nominatim (OpenStreetMap)
  async function tryNominatim(){
    const url = `https://nominatim.openstreetmap.org/search?format=json&limit=6&countrycodes=vn&viewbox=106.3,11.3,107.1,10.3&bounded=0&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return data.map(item => ({
      title: item.display_name.split(',').slice(0,2).join(','),
      full: item.display_name,
      lat: parseFloat(item.lat),
      lon: parseFloat(item.lon)
    }));
  }

  // Provider 2 (fallback): Photon (Komoot)
  async function tryPhoton(){
    const url = `https://photon.komoot.io/api/?limit=6&lat=10.8&lon=106.65&q=${encodeURIComponent(q)}`;
    const res = await fetch(url, { mode: 'cors' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    return (data.features || []).map(f => {
      const p = f.properties || {};
      const parts = [p.name, p.street, p.district, p.city, p.state, p.country].filter(Boolean);
      return {
        title: parts.slice(0,2).join(', ') || p.name || q,
        full: parts.join(', '),
        lat: f.geometry.coordinates[1],
        lon: f.geometry.coordinates[0]
      };
    });
  }

  let results = [];
  let lastErr = null;
  try {
    results = await tryNominatim();
  } catch (err1){
    lastErr = err1;
    try {
      results = await tryPhoton();
      lastErr = null;
    } catch (err2){
      lastErr = err2;
    }
  }

  resultsEl.innerHTML = '';
  if (lastErr){
    resultsEl.innerHTML = `<div class="search-loading">Không kết nối được dịch vụ tra cứu địa chỉ (mạng có thể đang chặn). Chi tiết: ${lastErr.message}. Bạn vẫn có thể nhập toạ độ trực tiếp, VD: 10.85,106.65</div>`;
    return;
  }
  if (results.length === 0){
    resultsEl.innerHTML = '<div class="search-loading">Không tìm thấy kết quả.</div>';
    return;
  }
  results.forEach(item => {
    const div = document.createElement('div');
    div.className = 'search-item';
    div.innerHTML = `<div class="si-title">${item.title}</div><div>${item.full}</div>`;
    div.addEventListener('click', () => {
      flyToResult(item.lat, item.lon, item.title);
    });
    resultsEl.appendChild(div);
  });
}

document.getElementById('geoSearchBtn').addEventListener('click', runGeoSearch);
document.getElementById('geoSearchBox').addEventListener('keydown', e => {
  if (e.key === 'Enter') runGeoSearch();
});

// Export KML (current radius, visible sites) as circle polygons
function circleToKmlPolygon(lat, lon, radiusM, points=36){
  const coords = [];
  const R = 6371000;
  for (let i=0;i<=points;i++){
    const angle = (i/points) * 2 * Math.PI;
    const dLat = (radiusM / R) * Math.cos(angle);
    const dLon = (radiusM / R) * Math.sin(angle) / Math.cos(lat * Math.PI/180);
    const plat = lat + dLat * 180/Math.PI;
    const plon = lon + dLon * 180/Math.PI;
    coords.push(`${plon.toFixed(6)},${plat.toFixed(6)},0`);
  }
  return coords.join(' ');
}

    <Placemark>
      <name>${site.n}</name>
      <description><![CDATA[STT: ${site.id}<br/>Site cũ: ${site.o}<br/>Trạng thái: ${site.s}]]></description>
      <Style>
        <LineStyle><color>${color}</color><width>2</width></LineStyle>
        <PolyStyle><color>33${color.slice(2)}</color></PolyStyle>
      </Style>
      <Polygon>
        <outerBoundaryIs><LinearRing><coordinates>${circleToKmlPolygon(site.lat, site.lon, currentRadius)}</coordinates></LinearRing></outerBoundaryIs>
      </Polygon>
    </Placemark>
    <Placemark>
      <name>${site.n} (điểm)</name>
      <Point><coordinates>${site.lon},${site.lat},0</coordinates></Point>
    </Placemark>`;
  });
  const kml = `<?xml version="1.0" encoding="UTF-8"?>
<kml xmlns="http://www.opengis.net/kml/2.2">
<Document>
  <name>Vi tri phat song 5G - ban kinh ${currentRadius}m</name>
  ${placemarks}
</Document>
</kml>`;
  const blob = new Blob([kml], { type: 'application/vnd.google-earth.kml+xml' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `5G_sites_r${currentRadius}m.kml`;
  a.click();
  URL.revokeObjectURL(url);
});


</script>
</body>
</html>
